[package]
name = "sharekvm-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["desktop"]
# Input hooks/injection, clipboard and mDNS: the macOS/Windows/Linux desktop engine.
# Without it, the crate is the portable core (protocol, pairing, encryption,
# trust store, file transfer, screen geometry) used by the Android app.
desktop = ["dep:rdev", "dep:arboard", "dep:mdns-sd", "dep:core-foundation", "dep:core-graphics", "dep:objc", "dep:windows-sys"]

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false, optional = true }
bincode = "1.3"
chacha20poly1305 = "0.10"
crossbeam-channel = "0.5"
hkdf = "0.12"
log = "0.4"
mdns-sd = { version = "0.13", optional = true }
rand = "0.8"
rdev = { version = "0.5.3", features = ["serialize", "unstable_grab"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
spake2 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.9", optional = true }
core-graphics = { version = "0.23", optional = true }
objc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
