[package]
name = "sharekvm-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# cdylib: libsharekvm_android.so, loaded by the Android app through JNI.
# rlib: so the key mapping can be unit-tested on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
jni = "0.21"
log = "0.4"
serde_json = "1"
sharekvm-core = { path = "../sharekvm-core", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
